name: Release

# Builds self-contained packages for Windows, Linux and macOS and publishes
# them as a GitHub release. Triggered by pushing a tag such as `v0.2.0`, or
# manually from the Actions tab (which produces artifacts but no release).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
          - name: linux-x64
            # Build on the oldest supported runner for broad glibc compatibility
            os: ubuntu-22.04
          - name: macos-universal
            os: macos-14

    steps:
      - uses: actions/checkout@v5

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(grep -m1 -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | cut -d' ' -f2)-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        # SDL is built from source; these headers enable its X11, Wayland,
        # ALSA, PulseAudio and PipeWire backends (all loaded at runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            libdecor-0-dev libegl-dev libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libdbus-1-dev libudev-dev libibus-1.0-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build
          -DENGINE_SIM_BUNDLED_SDL=ON
          -DENGINE_SIM_BUILD_TESTS=OFF
          -DDISCORD_ENABLED=ON

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DENGINE_SIM_BUNDLED_SDL=ON
          -DENGINE_SIM_BUILD_TESTS=OFF

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DENGINE_SIM_BUNDLED_SDL=ON
          -DENGINE_SIM_BUILD_TESTS=OFF
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage
        shell: bash
        run: |
          STAGE="engine-sim-${{ steps.version.outputs.version }}-${{ matrix.name }}"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          cmake --install build --config Release --prefix "dist/$STAGE"

      - name: Verify package (Linux)
        if: runner.os == 'Linux'
        run: |
          test -f "dist/$STAGE/assets/main.mr"
          test -f "dist/$STAGE/es/engine_sim.mr"
          test -d "dist/$STAGE/delta/shaders/glsl"
          # Only system libraries may be required at runtime
          ldd "dist/$STAGE/bin/engine-sim-app"
          if ldd "dist/$STAGE/bin/engine-sim-app" | grep -i "sdl\|not found"; then exit 1; fi
          "dist/$STAGE/bin/engine-sim-app" --version

      - name: Verify package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="dist/$STAGE/Engine Simulator.app"
          test -f "$APP/Contents/Resources/assets/main.mr"
          test -f "$APP/Contents/Resources/es/engine_sim.mr"
          lipo -info "$APP/Contents/MacOS/Engine Simulator"
          otool -L "$APP/Contents/MacOS/Engine Simulator"
          if otool -L "$APP/Contents/MacOS/Engine Simulator" | grep -i "sdl\|homebrew"; then exit 1; fi
          "$APP/Contents/MacOS/Engine Simulator" --version

      - name: Sign app bundle (macOS)
        if: runner.os == 'macOS'
        # Ad-hoc signature so that Apple Silicon Macs will run the binary
        run: codesign --force --deep --sign - "dist/$STAGE/Engine Simulator.app"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:STAGE" -DestinationPath "dist/$env:STAGE.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf "dist/$STAGE.tar.gz" "$STAGE"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # ditto preserves the bundle structure and code signature
        run: ditto -c -k --keepParent "dist/$STAGE" "dist/$STAGE.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STAGE }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Use the matching section of the changelog as the release notes
          awk -v ver="$VERSION" '
            /^## / { if (found) exit; if (index($0, "[" ver "]") || index($0, " " ver)) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Engine Simulator ${GITHUB_REF_NAME}" > release-notes.md
          fi
          cat release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --title "Engine Simulator ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            $PRERELEASE
