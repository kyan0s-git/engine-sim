name: Build

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: Linux (Clang)
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: macOS (Apple Silicon)
            os: macos-14
          - name: Windows (MSVC)
            os: windows-2022

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev libgl-dev libgtest-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja sdl2 googletest

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        # SDL2 is built from source and linked statically on Windows
        run: cmake -S . -B build -DENGINE_SIM_BUNDLED_SDL=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate bundled scripts (Linux)
        if: runner.os == 'Linux' && matrix.cc == 'gcc'
        # Compiles every bundled engine and theme script and runs each engine
        # headlessly; every engine must start and keep running (radial.mr
        # files are part libraries, not engines)
        run: |
          ./build/engine-sim-script-check --data . --require-running assets/main.mr assets/themes/*.mr \
            $(find assets/engines -name '*.mr' ! -name 'radial.mr' | sort) \
            --presets build/presets

      - name: Engineering dyno sweep
        if: runner.os != 'Windows'
        # Short sweep of the engineering reference engine; fails if the
        # engine produces no torque
        run: |
          ./build/engine-sim-dyno --data . --from 2000 --to 6000 --step 2000 \
            --settle 1.0 --measure 0.5 assets/engines/engineering/audi_i5_engineering.mr | tee dyno.csv
          awk -F, 'NR > 1 && $3 < 100 { print "low torque at " $1 " rpm"; bad = 1 } END { exit bad }' dyno.csv

      - name: Smoke test (Linux)
        if: runner.os == 'Linux' && matrix.cc == 'gcc'
        run: |
          sudo apt-get install -y xvfb
          ./build/bin/engine-sim-app --version
          export SDL_AUDIODRIVER=dummy
          # Run the application for a few seconds on a virtual display and
          # make sure that it neither crashes nor fails to start
          xvfb-run -a -s "-screen 0 1280x720x24" timeout --preserve-status -s INT -k 10 15 ./build/bin/engine-sim-app || status=$?
          echo "exit status: ${status:-0}"
          # 130 = interrupted by the timeout (expected)
          if [ "${status:-0}" != "0" ] && [ "${status:-0}" != "130" ]; then exit 1; fi
